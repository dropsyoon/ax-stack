name: ax-stack

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - landing

  landing:
    image: nginx:alpine
    container_name: landing
    restart: unless-stopped
    volumes:
      - ./sites/landing:/usr/share/nginx/html:ro
    networks:
      - web

  # ── 서브도메인 정적 데모 예시 (hello.ax-stack.com) ──
  # 정적 포트폴리오의 표준 패턴: nginx:alpine + sites/<id> 마운트 + mem_limit.
  hello:
    image: nginx:alpine
    container_name: hello-web
    restart: unless-stopped
    volumes:
      - ./sites/hello:/usr/share/nginx/html:ro
    networks:
      - web
    mem_limit: 64m

networks:
  web:
    name: ax-stack-web

volumes:
  caddy_data:
  caddy_config:
