<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hello · ax-stack</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                     "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1b2a4a 0%, #0b0f1a 55%, #060810 100%);
        color: #e8edf7;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; text-align: center; padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 640px; }
      .badge {
        display: inline-block; font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
        color: #7fa6ff; border: 1px solid rgba(127,166,255,.35);
        padding: 6px 14px; border-radius: 999px; margin-bottom: 28px;
        background: rgba(127,166,255,.06);
      }
      h1 {
        font-size: clamp(36px, 8vw, 72px); font-weight: 800; line-height: 1.05;
        background: linear-gradient(180deg, #ffffff 0%, #aebfe0 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        margin-bottom: 16px;
      }
      p { opacity: .6; line-height: 1.7; font-size: 15px; }
      code { color: #7fa6ff; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <span class="badge">ax-stack · subdomain demo</span>
      <h1>hello 👋</h1>
      <p>
        <code>hello.ax-stack.com</code> 서브도메인이 정상 동작합니다.<br />
        Caddy 자동 HTTPS + 독립 컨테이너 라우팅 검증용 페이지입니다.
      </p>
    </div>
  </body>
</html>
